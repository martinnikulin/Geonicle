name: tests

# Тесты данных (Geonicle.Data.Tests) на Linux при каждом пуше в master и в pull request.
# WPF-часть (DevExpress) здесь не собирается.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Geonicle.Data.Tests --configuration Release
